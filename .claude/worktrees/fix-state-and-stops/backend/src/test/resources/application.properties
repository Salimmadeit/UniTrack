# Test-only configuration.
#
# The main profile writes to a file-backed H2 database (./data/unitrackdb).
# Tests must never touch that file: a failed run could leave the developer's
# local data corrupted, and on CI two parallel jobs would fight over the lock.
# An in-memory database is created and destroyed per test run instead.
spring.datasource.url=jdbc:h2:mem:unitrack-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Not needed by tests, and leaving it on opens a servlet for no reason.
spring.h2.console.enabled=false
