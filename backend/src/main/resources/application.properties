spring.application.name=UniTrack

# Container hosts (Render, Railway, Fly.io, Cloud Run) assign a port at runtime
# and inject it as $PORT. Binding to a hardcoded 8080 makes the platform's
# health check fail and the deploy is marked unhealthy even though the app
# started fine. The :8080 fallback keeps local development unchanged.
server.port=${PORT:8080}

# Graceful shutdown: let in-flight requests finish when the platform sends
# SIGTERM during a redeploy, instead of dropping them mid-response.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- Datasource -------------------------------------------------------------
# Every value is env-overridable so the app can be pointed at a managed
# database without a code change or rebuild.
#
# WARNING: the default is a file-backed H2 database inside the container. On a
# host with an ephemeral filesystem (which includes Render's free tier) that
# file is destroyed on every restart and every redeploy, so locations and queue
# reports do not survive. That is acceptable for a demo, since DataSeeder
# recreates the routes and stops on boot, but it is not persistence.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/unitrackdb}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.database-platform=${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}

# ---- JPA --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 console -------------------------------------------------------------
# Off by default. This endpoint is an unauthenticated SQL shell: left enabled on
# a public host, anyone who requests /h2-console can read and modify the whole
# database using the credentials above. Switch it on only for local debugging,
# via H2_CONSOLE_ENABLED=true.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ---- CORS -------------------------------------------------------------------
# Comma-separated origin allowlist consumed by CorsConfig.
#
# The default "*" is what a local file:// page or a static server on another
# port needs in development. In production, set this to the deployed frontend
# origin, e.g. CORS_ALLOWED_ORIGINS=https://unitrack.netlify.app
#
# If the frontend is deployed behind the Netlify proxy in netlify.toml, the
# browser never makes a cross-origin request at all and this setting is unused.
unitrack.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
